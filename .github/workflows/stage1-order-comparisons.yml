name: Build Stage 1 order-comparison videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage1-order-comparisons.yml

permissions:
  contents: write

concurrency:
  group: stage1-orders-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install execution dependencies
        run: |
          python -m pip install -r requirements.txt nbclient nbformat ipykernel
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Build standalone notebook and test both orders
        run: |
          python scripts/extend_stage1_orders.py
          python scripts/check_stage1_orders.py
      - name: Execute standard settings and retain videos and final snapshots
        run: python -u scripts/execute_stage1_orders.py
      - name: Document standalone animation notebook
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          title = '## 6方式・MUSCL・1次と2次精度の動画比較'
          if title not in s:
              s += '\n\n' + title + '\n\n'
              s += '[euler1d_stage1_light.ipynb](notebooks/euler1d_stage1_light.ipynb) は計算コードを内蔵した単独実行Notebookです。実行結果の動画と最終時刻の図を保存しています。\n\n'
              s += '- A：古典的LF・LWと、区分一定＋前進EulerのRoe・LLF (Rusanov)・HLL・HLLC。LWだけはRichtmyerの2次精度法です。\n'
              s += '- B：同じMUSCL・リミッター・SSP-RK2で、4種類の数値流束を比較します。\n'
              s += '- C：各数値流束について、区分一定＋前進EulerとMUSCL＋SSP-RK2を比較します。空間と時間を同時に変える総合比較です。\n\n'
              s += 'Aは7問題・14本、B・Cは標準でエントロピー波・移動接触面・Sodの密度を使う15本です。`ORDER_CFG`で問題、流束、リミッター、物理量を選択できます。選択肢は設定セルの直前にあります。MP4の再生成にはffmpegを使い、未導入ならNotebook内のJavaScript動画へ切り替えます。\n\n'
              s += '`stage1_animation_outputs/stage1_orders_gallery.html`は動画を内蔵した一覧です。元の数値積分の時間刻みを変えず、表示用に受理済み状態を補間します。停止後の曲線は表示しません。\n'
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit executed notebook and validation reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/euler1d_stage1_light.ipynb validation/stage1_order_tests.json validation/stage1_order_execution.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Save 29 comparison videos and 15 final-state figures in standalone Euler notebook'
            git push origin HEAD:main
          fi
      - name: Package executed standalone notebook and offline video gallery
        uses: actions/upload-artifact@v4
        with:
          name: stage1-muscl-order-comparisons
          path: |
            notebooks/euler1d_stage1_light.ipynb
            stage1_animation_outputs/stage1_orders_gallery.html
            stage1_animation_outputs/animations/*.mp4
            validation/stage1_order_tests.json
            validation/stage1_order_execution.json
            README.md
            requirements.txt
          if-no-files-found: error
          retention-days: 7
