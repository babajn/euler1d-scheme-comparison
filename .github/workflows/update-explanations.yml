name: Validate notebook teaching text

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install nbformat
      - name: Validate current versioned notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          paths = sorted(Path('notebooks').glob('0[1-5]_*.ipynb'))
          assert len(paths) == 5
          for path in paths:
              nb = nbformat.read(path, as_version=4)
              nbformat.validate(nb)
              titles = [line for c in nb.cells if c.cell_type == 'markdown' for line in c.source.splitlines() if line.startswith('# ')]
              assert len(titles) == 1, (path, titles)
              code = [c for c in nb.cells if c.cell_type == 'code']
              assert all(c.execution_count is not None for c in code)
              assert not any(o.output_type == 'error' for c in code for o in c.outputs)
              print(path.name, len(code), 'executed cells; unique title')
          PY
