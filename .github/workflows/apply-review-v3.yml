name: Apply and validate teaching revision

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-review-v3.yml

permissions:
  contents: write

concurrency:
  group: notebook-publishing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt nbclient nbformat ipykernel
      - name: Apply explanations exercises and hierarchy
        run: python scripts/apply_review_revision.py
      - name: Execute all five notebooks in fresh kernels
        run: python scripts/execute_review_notebooks.py
      - name: Validate outputs reference solutions and numerical tests
        run: python scripts/validate_review_notebooks.py
      - name: Commit complete executed revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/0[1-5]_*.ipynb src/euler1d_core.py src/review_experiments.py README.md validation/review_revision_structure.json validation/review_execution.json validation/review_v3_validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Teach derivations and interpret numerical experiments with checked outputs"
            git push origin HEAD:main
          fi
      - name: Package the executed teaching material
        uses: actions/upload-artifact@v4
        with:
          name: euler1d-reviewed-with-outputs
          path: |
            notebooks/0[1-5]_*.ipynb
            src/
            scripts/
            docs/
            validation/
            README.md
            requirements.txt
            five_part_outputs/**/*.csv
            five_part_outputs/**/*.json
          retention-days: 7
          if-no-files-found: error
