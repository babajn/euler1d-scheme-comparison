name: Render and save notebook outputs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notebook-publishing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt nbclient nbformat ipykernel
      - name: Execute versioned notebooks in fresh kernels
        run: python scripts/execute_review_notebooks.py
      - name: Validate outputs and numerical checks
        run: python scripts/validate_review_notebooks.py
      - name: Commit executed notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/0[1-5]_*.ipynb validation/review_execution.json validation/review_v3_validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh checked notebook figures tables and animations"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notebooks-with-outputs
          path: |
            notebooks/0[1-5]_*.ipynb
            src/
            scripts/
            docs/
            validation/
            README.md
            requirements.txt
          retention-days: 7
          if-no-files-found: error
